<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vora</title>
    <meta name="description" content="Find jobs, tailor your CV and cover letters with AI, track applications and prepare for interviews." />
    <meta name="theme-color" content="#fcfdff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f15" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/favicon-48.png" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vora" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Source+Sans+3:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      /* Opening animation. Inline so it shows before styles.css and the app load. */
      #splash {
        --sp-bg: #fcfdff; --sp-ink: #212327; --sp-brand: #2255d5; --sp-track: #e9ecf1; --sp-glow: rgba(34, 85, 213, .14); --sp-shine: rgba(255, 255, 255, .85);
        position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; pointer-events: none;
        background: radial-gradient(60% 45% at 50% 42%, var(--sp-glow), transparent 70%), var(--sp-bg);
        transition: opacity .55s cubic-bezier(.4, 0, .2, 1), visibility 0s .55s;
        animation: sp-failsafe 0s 8s forwards; /* never stays up if the app fails to start */
      }
      @media (prefers-color-scheme: dark) {
        #splash { --sp-bg: #0d0f15; --sp-ink: #e8edf7; --sp-brand: #3368ea; --sp-track: #22262d; --sp-glow: rgba(51, 104, 234, .22); --sp-shine: rgba(255, 255, 255, .55); }
      }
      #splash .sp-inner { display: grid; justify-items: center; gap: 18px; transition: transform .6s cubic-bezier(.4, 0, .2, 1); }
      #splash .sp-mark { position: relative; width: 76px; height: 76px; opacity: 0; filter: blur(8px); transform: scale(.82) translateY(6px); animation: sp-mark .8s cubic-bezier(.16, 1, .3, 1) .05s forwards; }
      #splash .sp-mark img { width: 100%; height: 100%; display: block; }
      #splash .sp-mark::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(105deg, transparent 35%, var(--sp-shine) 50%, transparent 65%) no-repeat;
        background-size: 250% 100%; background-position: 130% 0;
        -webkit-mask: var(--sp-logo) center / contain no-repeat; mask: var(--sp-logo) center / contain no-repeat;
        animation: sp-shine 1.1s cubic-bezier(.4, 0, .2, 1) .7s forwards;
      }
      #splash .sp-word { display: flex; font: 700 22px/1 Figtree, system-ui, -apple-system, 'Segoe UI', sans-serif; letter-spacing: .32em; margin-right: -.32em; color: var(--sp-ink); }
      #splash .sp-word span { opacity: 0; transform: translateY(10px); animation: sp-letter .6s cubic-bezier(.16, 1, .3, 1) forwards; }
      #splash .sp-word span:nth-child(1) { animation-delay: .35s; }
      #splash .sp-word span:nth-child(2) { animation-delay: .42s; }
      #splash .sp-word span:nth-child(3) { animation-delay: .49s; }
      #splash .sp-word span:nth-child(4) { animation-delay: .56s; }
      #splash .sp-bar { position: relative; width: 112px; height: 3px; border-radius: 3px; background: var(--sp-track); overflow: hidden; opacity: 0; animation: sp-fade .4s ease .7s forwards; }
      #splash .sp-bar::before { content: ''; position: absolute; inset: 0 auto 0 0; width: 40%; border-radius: inherit; background: linear-gradient(90deg, transparent, var(--sp-brand) 30%, var(--sp-brand) 70%, transparent); animation: sp-glide 1.15s cubic-bezier(.65, 0, .35, 1) .75s infinite; transform: translateX(-100%); }
      #splash.done { opacity: 0; visibility: hidden; }
      #splash.done .sp-inner { transform: scale(1.06); }
      #splash.done .sp-bar::before { animation: none; transform: none; width: 100%; transition: width .3s ease; }
      @keyframes sp-mark { to { opacity: 1; filter: blur(0); transform: none; } }
      @keyframes sp-letter { to { opacity: 1; transform: none; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-shine { to { background-position: -30% 0; } }
      @keyframes sp-glide { to { transform: translateX(260%); } }
      @keyframes sp-failsafe { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) {
        #splash .sp-mark, #splash .sp-word span, #splash .sp-bar { animation: none; opacity: 1; filter: none; transform: none; }
        #splash .sp-mark::after, #splash .sp-bar::before { animation: none; display: none; }
        #splash.done .sp-inner { transform: none; }
      }
      /* The page underneath settles in as the splash leaves. */
      html.app-in #view { animation: sp-view .6s cubic-bezier(.16, 1, .3, 1); }
      @keyframes sp-view { from { opacity: 0; transform: translateY(10px); } }
      @media (prefers-reduced-motion: reduce) { html.app-in #view { animation: none; } }
    </style>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="splash" role="progressbar" aria-label="Loading Vora" style="--sp-logo: url(icons/vora-mark.png)">
      <div class="sp-inner">
        <div class="sp-mark"><img src="icons/vora-mark.png" alt="" width="76" height="76" /></div>
        <div class="sp-word" aria-hidden="true"><span>V</span><span>O</span><span>R</span><span>A</span></div>
        <div class="sp-bar"></div>
      </div>
    </div>
    <a class="skip" href="#view">Skip to content</a>
    <header class="appbar">
      <div class="appbar-inner">
        <a class="brand" href="#/" aria-label="Vora, home"><img src="icons/vora-mark-96.png" alt="" width="40" height="40" /><span>Vora</span></a>
        <nav class="mainnav" aria-label="Main">
          <a href="#/">Home</a>
          <a href="#/find">Find jobs</a>
          <a href="#/tracker">Applications</a>
          <a href="#/profile">Profile &amp; CV</a>
        </nav>
        <div class="appbar-actions">
          <button id="install-btn" class="btn small install" hidden>Install app</button>
          <button id="account-btn" class="account-btn" type="button" aria-haspopup="dialog" aria-label="Create account or sign in"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span class="account-label">Sign in</span></button>
          <a class="icon-link" href="#/settings" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
        </div>
      </div>
    </header>
    <main id="view" tabindex="-1"></main>
    <nav class="tabbar" aria-label="Main">
      <a href="#/"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></a>
      <a href="#/find"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg><span>Find jobs</span></a>
      <a href="#/tracker"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/></svg><span>Applications</span></a>
      <a href="#/profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6"/></svg><span>Profile</span></a>
    </nav>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Vora needs JavaScript enabled.</noscript>
  </body>
</html>
